name: Check reviews

on:
  schedule:
    - cron: "0 11,23 * * *" # 18:00 và 06:00 giờ Việt Nam (UTC+7); mỗi lần chạy tốn 1 lượt SerpApi cho mỗi nguồn
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron"
